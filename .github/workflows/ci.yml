name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The engine is web-first; nothing here should depend on a developer's shell.
  CI: 'true'

jobs:
  verify:
    name: Static analysis and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The claims ledger resolves every commit a document
          # names, and the default shallow clone cannot reach the older ones —
          # under which the gate would fail for the wrong reason.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Every documented code change names the commit that made it, and this
      # asserts the commit really touches the file. Three times a fix was
      # recorded as landed before it landed; see docs/BUGS.md RC-0005.
      - name: Claims ledger
        run: pnpm verify:claims

      # The other half of the same problem: a comment claiming a runtime
      # property must name a spec, test or job that exists. The ledger cannot
      # see this — a commit had touched both files that lied. See RC-0010.
      - name: Runtime assertions
        run: pnpm verify:assertions

      # Nothing may be in the tree that nobody accounted for. A review writes
      # its report and nothing else; one wrote a scratch file here instead.
      # See docs/SECURITY.md SEC-0001.
      - name: Tree hygiene
        run: pnpm check:tree

      - name: Unit and integration tests
        run: pnpm test

      - name: Audit harness self-test
        run: pnpm audit:selftest

      # Coverage, proven by neutering production code rather than by reasoning
      # about detectors. The unit subset runs on every commit; the e2e subset is
      # a phase-gate step because it needs a browser. A survivor is a coverage
      # hole and fails the build. See docs/BUGS.md RC-0009 and RC-0015.
      - name: Mutation sweep (unit)
        run: pnpm mutation:sweep -- --control

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end on three device profiles
    runs-on: ubuntu-latest
    needs: verify
    # Pinned to the Playwright image matching the repo's Playwright version so
    # rendering is reproducible. Screenshot baselines are locked against this
    # image from phase 3 onward; see docs/GAPS.md.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Mirrors the ordering of `pnpm sweep`. The bundle budget is enforced from
      # P0 and is measured from a build artifact, so the build and the bundle
      # measurement must both happen before the gate runs — otherwise the gate
      # correctly fails the run for a budget nobody measured.
      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm audit:bundle

      - name: End-to-end suite
        run: pnpm test:e2e

      # Verifies CPU throttling is actually in effect before any budget named
      # for a device is believed. Remove the throttling and every ratio
      # collapses to 1.00x and this step fails.
      - name: Profile ordering
        run: pnpm audit:profile-ordering

      - name: Performance budgets
        run: pnpm audit:budgets

      # The browser half of the mutation sweep, which is where the class that
      # cost the most lives: replacing SceneView.present with an empty function
      # left 794 tests green (RC-0009). Runs here rather than per commit because
      # each mutation reruns the whole E2E suite.
      - name: Mutation sweep (e2e)
        run: pnpm mutation:sweep -- --suite e2e

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-output
          path: |
            .audit-out/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
