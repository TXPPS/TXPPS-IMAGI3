name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The engine is web-first; nothing here should depend on a developer's shell.
  CI: 'true'

jobs:
  verify:
    name: Static analysis and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Audit harness self-test
        run: pnpm audit:selftest

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end on three device profiles
    runs-on: ubuntu-latest
    needs: verify
    # Pinned to the Playwright image matching the repo's Playwright version so
    # rendering is reproducible. Screenshot baselines are locked against this
    # image from phase 3 onward; see docs/GAPS.md.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: End-to-end suite
        run: pnpm test:e2e

      - name: Performance budgets
        run: pnpm audit:budgets

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-output
          path: |
            .audit-out/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
